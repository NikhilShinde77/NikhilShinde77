<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" font-family="Poppins,Arial,sans-serif">
  <defs>
    <linearGradient id="langBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="398" height="238" rx="10" fill="url(#langBg)" stroke="#3a6bff" stroke-opacity="0.5"/>
  <text x="20" y="34" font-size="16" font-weight="700" fill="#ffffff">Most Used Languages</text>
  <g transform="translate(20,58)">
    
    <text x="0" y="13" font-size="13" fill="#c3cad6">JavaScript</text>
    <text x="360" y="13" font-size="12" fill="#7c8699" text-anchor="end">38%</text>
    <rect x="0" y="20" width="360" height="8" rx="3" fill="#1a1f2b"/>
    <rect x="0" y="20" width="0" height="8" rx="3" fill="#1550e0">
      <animate attributeName="width" from="0" to="99" begin="0.30s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
    </rect>
    <text x="0" y="49" font-size="13" fill="#c3cad6">Java</text>
    <text x="360" y="49" font-size="12" fill="#7c8699" text-anchor="end">22%</text>
    <rect x="0" y="56" width="360" height="8" rx="3" fill="#1a1f2b"/>
    <rect x="0" y="56" width="0" height="8" rx="3" fill="#1e5fff">
      <animate attributeName="width" from="0" to="57" begin="0.45s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
    </rect>
    <text x="0" y="85" font-size="13" fill="#c3cad6">Python</text>
    <text x="360" y="85" font-size="12" fill="#7c8699" text-anchor="end">18%</text>
    <rect x="0" y="92" width="360" height="8" rx="3" fill="#1a1f2b"/>
    <rect x="0" y="92" width="0" height="8" rx="3" fill="#00d4ff">
      <animate attributeName="width" from="0" to="47" begin="0.60s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
    </rect>
    <text x="0" y="121" font-size="13" fill="#c3cad6">HTML</text>
    <text x="360" y="121" font-size="12" fill="#7c8699" text-anchor="end">12%</text>
    <rect x="0" y="128" width="360" height="8" rx="3" fill="#1a1f2b"/>
    <rect x="0" y="128" width="0" height="8" rx="3" fill="#8f9bb3">
      <animate attributeName="width" from="0" to="31" begin="0.75s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
    </rect>
    <text x="0" y="157" font-size="13" fill="#c3cad6">CSS</text>
    <text x="360" y="157" font-size="12" fill="#7c8699" text-anchor="end">10%</text>
    <rect x="0" y="164" width="360" height="8" rx="3" fill="#1a1f2b"/>
    <rect x="0" y="164" width="0" height="8" rx="3" fill="#3a4bff">
      <animate attributeName="width" from="0" to="26" begin="0.90s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
    </rect>
  </g>
</svg>