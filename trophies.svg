<svg viewBox="0 0 404 160" xmlns="http://www.w3.org/2000/svg" font-family="Poppins,Arial,sans-serif">
  <rect x="0" y="0" width="404" height="160" rx="10" fill="#050608"/>
  
    <g transform="translate(0,0)" opacity="0">
      <animate attributeName="opacity" begin="0.30s" dur="0.35s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.6" to="1" begin="0.30s" dur="0.4s" fill="freeze" additive="sum" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      <rect x="4" y="4" width="88" height="150" rx="8" fill="#0b0e14" stroke="#1550e0" stroke-width="1.6"/>
      <rect x="4" y="4" width="88" height="150" rx="8" fill="#1550e0" opacity="0">
        <animate attributeName="opacity" values="0;0.16;0" dur="2.6s" begin="0.70s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="50" text-anchor="middle" font-size="30">🏆</text>
      <text x="48" y="88" text-anchor="middle" font-size="13" fill="#c3cad6">Commits</text>
      <text x="48" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#1550e0">SSS</text>
    </g>
    <g transform="translate(100,0)" opacity="0">
      <animate attributeName="opacity" begin="0.50s" dur="0.35s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.6" to="1" begin="0.50s" dur="0.4s" fill="freeze" additive="sum" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      <rect x="4" y="4" width="88" height="150" rx="8" fill="#0b0e14" stroke="#1e5fff" stroke-width="1.6"/>
      <rect x="4" y="4" width="88" height="150" rx="8" fill="#1e5fff" opacity="0">
        <animate attributeName="opacity" values="0;0.16;0" dur="2.6s" begin="0.90s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="50" text-anchor="middle" font-size="30">🏆</text>
      <text x="48" y="88" text-anchor="middle" font-size="13" fill="#c3cad6">Stars</text>
      <text x="48" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#1e5fff">A+</text>
    </g>
    <g transform="translate(200,0)" opacity="0">
      <animate attributeName="opacity" begin="0.70s" dur="0.35s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.6" to="1" begin="0.70s" dur="0.4s" fill="freeze" additive="sum" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      <rect x="4" y="4" width="88" height="150" rx="8" fill="#0b0e14" stroke="#00d4ff" stroke-width="1.6"/>
      <rect x="4" y="4" width="88" height="150" rx="8" fill="#00d4ff" opacity="0">
        <animate attributeName="opacity" values="0;0.16;0" dur="2.6s" begin="1.10s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="50" text-anchor="middle" font-size="30">🏆</text>
      <text x="48" y="88" text-anchor="middle" font-size="13" fill="#c3cad6">PRs</text>
      <text x="48" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#00d4ff">A</text>
    </g>
    <g transform="translate(300,0)" opacity="0">
      <animate attributeName="opacity" begin="0.90s" dur="0.35s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" from="0.6" to="1" begin="0.90s" dur="0.4s" fill="freeze" additive="sum" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      <rect x="4" y="4" width="88" height="150" rx="8" fill="#0b0e14" stroke="#8f9bb3" stroke-width="1.6"/>
      <rect x="4" y="4" width="88" height="150" rx="8" fill="#8f9bb3" opacity="0">
        <animate attributeName="opacity" values="0;0.16;0" dur="2.6s" begin="1.30s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="50" text-anchor="middle" font-size="30">🏆</text>
      <text x="48" y="88" text-anchor="middle" font-size="13" fill="#c3cad6">Repos</text>
      <text x="48" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#8f9bb3">B+</text>
    </g>
</svg>